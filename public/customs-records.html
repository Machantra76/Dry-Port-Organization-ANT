<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>តារាងបញ្ជីទិន្នន័យប្រព័ន្ធគយ (Customs System Data Records)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Kantumruy Pro -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kantumruy Pro', sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }
        .main-container {
            max-width: 1350px;
            margin: 30px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        .btn-back {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            font-weight: 500;
            border-radius: 8px;
            padding: 10px 18px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.2);
            transition: all 0.2s;
        }
        .btn-back:hover {
            background: linear-gradient(135deg, #0369a1, #075985);
            color: white;
            transform: translateY(-1px);
        }
        .page-title {
            color: #1e3a8a;
            font-weight: 700;
            margin-top: 20px;
            font-size: 1.75rem;
        }
        .page-subtitle {
            color: #6c757d;
            font-size: 0.95rem;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .section-card {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
            background-color: #ffffff;
        }
        .section-card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e3a8a;
            margin-bottom: 20px;
        }
        .form-label {
            font-weight: 500;
            font-size: 0.9rem;
            color: #495057;
        }
        .form-control {
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            padding: 10px 14px;
            font-size: 0.9rem;
            font-family: 'Kantumruy Pro', sans-serif;
        }
        .form-control:focus {
            border-color: #0d9488;
            box-shadow: 0 0 0 0.2rem rgba(13, 148, 136, 0.15);
        }
        .btn-filter-custom {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 8px;
            padding: 10px 14px;
            box-shadow: 0 3px 10px rgba(99, 102, 241, 0.25);
            transition: all 0.2s;
            width: 100%;
        }
        .btn-filter-custom:hover {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            color: white;
        }
        .btn-reset-custom {
            background-color: #e2e8f0;
            border: none;
            color: #334155;
            font-weight: 600;
            border-radius: 8px;
            padding: 10px 14px;
            transition: all 0.2s;
            width: 100%;
        }
        .btn-reset-custom:hover {
            background-color: #cbd5e1;
            color: #1e293b;
        }
        .btn-print-custom {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 8px;
            padding: 10px 14px;
            box-shadow: 0 3px 10px rgba(245, 158, 11, 0.25);
            transition: all 0.2s;
            width: 100%;
        }
        .btn-print-custom:hover {
            background: linear-gradient(135deg, #d97706, #b45309);
            color: white;
        }
        .table-custom-header {
            background-color: #1e3a8a !important;
            color: white !important;
            text-align: center;
            vertical-align: middle;
            font-size: 0.9rem;
        }
        .table tbody td {
            vertical-align: middle;
            font-size: 0.88rem;
            text-align: center;
        }
        .filter-action-bar {
            background-color: #f8fafc;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
        }
        @media print {
            @page { size: landscape; margin: 10mm; }
            .no-print { display: none !important; }
            body { background: white; }
            .main-container { box-shadow: none; padding: 0; max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- ប៊ូតុងត្រឡប់ទៅទំព័របញ្ចូលទិន្នន័យវិញ -->
    <div class="d-flex justify-content-between align-items-center mb-3 no-print">
        <a href="/doc-customs.html" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i> ត្រឡប់ទៅទំព័របញ្ចូលទិន្នន័យគយ
        </a>
    </div>

    <!-- ចំណងជើងទំព័រ -->
    <h2 class="page-title">តារាងបញ្ជីទិន្នន័យប្រព័ន្ធគយ</h2>
    <p class="page-subtitle">CUSTOMS SYSTEM DATA RECORDS TABLE</p>

    <!-- តារាងបង្ហាញទិន្នន័យប្រព័ន្ធគយ -->
    <div class="section-card">
        <div class="section-card-title mb-3"><i class="fa-solid fa-table-list me-2"></i> បញ្ជីទិន្នន័យសរុបក្នុងប្រព័ន្ធ</div>

        <!-- ផ្នែកស្វែងរក និងត្រង -->
        <div class="filter-action-bar no-print">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label">ស្វែងរក (កូដប្រព័ន្ធ / ក្រុមហ៊ុន):</label>
                    <input type="text" class="form-control" id="searchInput" placeholder="វាយស្វែងរក...">
                </div>
                <div class="col-md-3">
                    <label class="form-label">កាលបរិច្ឆេទចាប់ពី (From Date):</label>
                    <input type="date" class="form-control" id="fromDate">
                </div>
                <div class="col-md-3">
                    <label class="form-label">ដល់កាលបរិច្ឆេទ (To Date):</label>
                    <input type="date" class="form-control" id="toDate">
                </div>
                <div class="col-md-3">
                    <div class="row g-2">
                        <div class="col-4">
                            <button class="btn btn-filter-custom" onclick="filterCustomsData()" title="ត្រង"><i class="fa-solid fa-filter"></i></button>
                        </div>
                        <div class="col-4">
                            <button class="btn btn-reset-custom" onclick="resetFilter()" title="កំណត់ឡើងវិញ"><i class="fa-solid fa-rotate-right"></i></button>
                        </div>
                        <div class="col-4">
                            <button class="btn btn-print-custom" onclick="window.print()" title="បោះពុម្ព PDF"><i class="fa-solid fa-print"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- តារាងបង្ហាញទិន្នន័យ -->
        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead>
                    <tr>
                        <th class="table-custom-header">ល.រ (No.)</th>
                        <th class="table-custom-header">កូដប្រព័ន្ធ / សេចក្តីប្រកាស</th>
                        <th class="table-custom-header">ឈ្មោះក្រុមហ៊ុន</th>
                        <th class="table-custom-header">ប្រភេទប្រតិបត្តិការ</th>
                        <th class="table-custom-header">កាលបរិច្ឆេទ</th>
                        <th class="table-custom-header">មន្ត្រីប្រតិបត្តិករ</th>
                        <th class="table-custom-header">លេខយោង / ឯកសារ</th>
                        <th class="table-custom-header">ស្ថានភាព</th>
                        <th class="table-custom-header no-print">សកម្មភាព</th>
                    </tr>
                </thead>
                <tbody id="customsTableBody">
                    <tr><td colspan="9" class="text-center text-muted py-4">កំពុងទាញយកទិន្នន័យ...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let customsList = [];

    document.addEventListener('DOMContentLoaded', () => {
        loadCustomsData();
    });

    async function loadCustomsData() {
        try {
            const response = await fetch('/api/customs-system-data');
            customsList = await response.json();
            renderTable(customsList);
        } catch (err) {
            console.error('Error loading customs system data:', err);
            document.getElementById('customsTableBody').innerHTML = `<tr><td colspan="9" class="text-center text-danger py-4">មានបញ្ហាក្នុងការទាញយកទិន្នន័យពី Server</td></tr>`;
        }
    }

    function renderTable(data) {
        const tbody = document.getElementById('customsTableBody');
        tbody.innerHTML = '';

        if (!Array.isArray(data) || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="9" class="text-center text-muted py-4">ពុំមានទិន្នន័យប្រព័ន្ធគយទេ</td></tr>`;
            return;
        }

        data.forEach((item, index) => {
            let statusBadge = 'bg-secondary';
            if (item.system_status === 'Completed') statusBadge = 'bg-success';
            else if (item.system_status === 'Processing') statusBadge = 'bg-primary';
            else if (item.system_status === 'Pending') statusBadge = 'bg-warning text-dark';
            else if (item.system_status === 'Error') statusBadge = 'bg-danger';

            const row = `
                <tr>
                    <td>${index + 1}</td>
                    <td class="fw-bold text-primary">${item.sys_code}</td>
                    <td>${item.company_name}</td>
                    <td><span class="badge bg-dark">${item.transaction_type}</span></td>
                    <td>${item.entry_date ? item.entry_date.split('T')[0] : '-'}</td>
                    <td>${item.operator_name}</td>
                    <td>${item.reference_number || '-'}</td>
                    <td><span class="badge ${statusBadge}">${item.system_status}</span></td>
                    <td class="no-print">
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteCustomsData(${item.id})" title="លុប"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    }

    function filterCustomsData() {
        const keyword = document.getElementById('searchInput').value.toLowerCase();
        const fromDate = document.getElementById('fromDate').value;
        const toDate = document.getElementById('toDate').value;

        const filtered = customsList.filter(item => {
            const matchesKeyword = 
                (item.sys_code && item.sys_code.toLowerCase().includes(keyword)) || 
                (item.company_name && item.company_name.toLowerCase().includes(keyword));

            let matchesDate = true;
            if (item.entry_date) {
                const itemDate = item.entry_date.split('T')[0];
                if (fromDate && itemDate < fromDate) matchesDate = false;
                if (toDate && itemDate > toDate) matchesDate = false;
            } else if (fromDate || toDate) {
                matchesDate = false;
            }

            return matchesKeyword && matchesDate;
        });

        renderTable(filtered);
    }

    function resetFilter() {
        document.getElementById('searchInput').value = '';
        document.getElementById('fromDate').value = '';
        document.getElementById('toDate').value = '';
        renderTable(customsList);
    }

    async function deleteCustomsData(id) {
        if (confirm("តើអ្នកពិតជាចង់លុបទិន្នន័យនេះមែនទេ?")) {
            try {
                const response = await fetch(`/api/customs-system-data/${id}`, { method: 'DELETE' });
                const result = await response.json();
                if (response.ok && result.success) {
                    alert('បានលុបដោយជោគជ័យ!');
                    loadCustomsData();
                } else {
                    alert('មិនអាចលុបបានទេ!');
                }
            } catch (err) {
                console.error('Error deleting record:', err);
            }
        }
    }

    document.getElementById('searchInput').addEventListener('keyup', function() {
        filterCustomsData();
    });
</script>

</body>
</html>
