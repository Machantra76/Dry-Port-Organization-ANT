<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ការរៀបចំផែនការដឹកជញ្ជូនទំនិញ</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font (Battambang) -->
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Battambang', sans-serif;
            background-color: #f8f9fc;
            color: #5a5c69;
        }
        .main-container {
            max-width: 1300px;
            margin: 30px auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
            padding: 30px;
        }
        .btn-custom-back {
            background-color: #1d3557;
            color: white;
            border-radius: 8px;
            padding: 8px 16px;
            text-decoration: none;
            font-size: 14px;
            border: none;
        }
        .btn-custom-back:hover {
            background-color: #112238;
            color: white;
        }
        .section-box {
            border: 1px solid #e3e6f0;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
            background-color: #ffffff;
        }
        .section-title {
            font-weight: 700;
            font-size: 18px;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .form-label {
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }
        .form-control, .form-select {
            border-radius: 6px;
            padding: 10px 12px;
            border: 1px solid #d1d3e2;
            font-size: 14px;
        }
        .btn-submit {
            background-color: #1cc88a;
            border: none;
            color: white;
            font-weight: 700;
            padding: 12px;
            border-radius: 6px;
            width: 100%;
        }
        .btn-submit:hover {
            background-color: #13855c;
            color: white;
        }
        .table thead th {
            background-color: #1d3557;
            color: white;
            font-size: 14px;
            border: none;
            padding: 12px;
        }
        .table tbody td {
            font-size: 14px;
            padding: 12px;
            vertical-align: middle;
        }
        @media print {
            body { background-color: #fff; }
            .main-container { box-shadow: none; margin: 0; padding: 0; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- Top Navigation & Title -->
    <div class="mb-4 no-print">
        <a href="transport-fleet.html" class="btn-custom-back">
            <i class="fa-solid fa-arrow-left me-2"></i> ត្រឡប់ទៅ Transport Fleet វិញ
        </a>
    </div>

    <div class="mb-4">
        <h3 class="fw-bold text-dark">ការរៀបចំផែនការដឹកជញ្ជូនទំនិញ</h3>
        <p class="text-muted small">CARGO TRANSPORT PLANNING & SCHEDULING SYSTEM</p>
    </div>

    <!-- Form Box: បង្កើតផែនការដឹកជញ្ជូនថ្មី -->
    <div class="section-box no-print">
        <div class="section-title text-primary"><i class="fa-solid fa-plus-circle me-2"></i>បង្កើតផែនការដឹកជញ្ជូនថ្មី (Create Transport Plan)</div>
        <form id="transportPlanForm">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">លេខកូដកុងតឺន័រ / ទំនិញ (Container/Cargo Code):</label>
                    <input type="text" class="form-control" name="cargo_code" placeholder="ឧ. CNT-2026-001" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">ជ្រើសរើសរថយន្តដឹកជញ្ជូន (Vehicle Code):</label>
                    <select class="form-select vehicle-select" name="vehicle_code" required>
                        <option value="">-- ជ្រើសរើសរថយន្ត --</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">ទីតាំងដើម / ដើមทาง (Origin):</label>
                    <input type="text" class="form-control" name="origin" placeholder="ឧ. ភ្នំពេញ (Dry Port)" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">គោលដៅ / ปลายทาง (Destination):</label>
                    <input type="text" class="form-control" name="destination" placeholder="ឧ. ព្រះសីហនុ (Port)" required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">កាលបរិច្ឆេទចេញដំណើរ (Departure Date):</label>
                    <input type="date" class="form-control" name="departure_date" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">ឈ្មោះអ្នកបើកបរ (Driver Name):</label>
                    <select class="form-select driver-select" name="driver_name" required>
                        <option value="">-- ជ្រើសរើសឈ្មោះអ្នកបើកបរ --</option>
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">កំណត់សម្គាល់បន្ថែម (Notes):</label>
                <textarea class="form-control" name="notes" rows="2" placeholder="ព័ត៌មានលម្អិតអំពីទំនិញ ឬផ្លូវធ្វើដំណើរ..."></textarea>
            </div>
            <button type="submit" class="btn-submit" style="background-color: #4e73df;"><i class="fa-solid fa-save me-2"></i>រក្សាទុកផែនការ (Save Transport Plan)</button>
        </form>
    </div>

    <!-- Table Box: បញ្ជីផែនការដឹកជញ្ជូន -->
    <div class="section-box">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <div class="section-title mb-0"><i class="fa-solid fa-list me-2"></i>បញ្ជីផែនការដឹកជញ្ជូនទំនិញ (Transport Plans List)</div>
            <button onclick="window.print()" class="btn btn-secondary btn-sm no-print"><i class="fa-solid fa-print me-1"></i> បោះពុម្ព / រក្សាទុក PDF (Print / Save PDF)</button>
        </div>
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle" id="transportPlanTable">
                <thead>
                    <tr>
                        <th>ល.រ</th>
                        <th>កូដទំនិញ/កុងតឺន័រ</th>
                        <th>កូដរថយន្ត</th>
                        <th>ដើមทาง -> គោលដៅ</th>
                        <th>កាលបរិច្ឆេទចេញ</th>
                        <th>អ្នកបើកបរ</th>
                        <th>ស្ថានភាព</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- ទិន្នន័យទាញមកទីនេះ -->
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // ទាញយកបញ្ជីរថយន្តមកដាក់ក្នុង Dropdown[cite: 16]
    async function loadVehiclesDropdown() {
        try {
            const res = await fetch('/api/fleet/vehicles');
            const vehicles = await res.json();
            const selects = document.querySelectorAll('.vehicle-select');
            selects.forEach(select => {
                select.innerHTML = '<option value="">-- ជ្រើសរើសរថយន្ត --</option>';
                vehicles.forEach(v => {
                    select.innerHTML += `<option value="${v.vehicle_code}">${v.vehicle_code} - ${v.model} (${v.plate_number})</option>`;
                });
            });
        } catch (err) {
            console.error('Error loading vehicles:', err);
        }
    }

    // ទាញយកបញ្ជីអ្នកបើកបរមកដាក់ក្នុង Dropdown តាមសំណូមពរ
    async function loadDriversDropdown() {
        try {
            const res = await fetch('/api/fleet/drivers');
            const drivers = await res.json();
            const selects = document.querySelectorAll('.driver-select');
            selects.forEach(select => {
                select.innerHTML = '<option value="">-- ជ្រើសរើសឈ្មោះអ្នកបើកបរ --</option>';
                drivers.forEach(d => {
                    select.innerHTML += `<option value="${d.full_name}">${d.full_name} (${d.phone})</option>`;
                });
            });
        } catch (err) {
            console.error('Error loading drivers:', err);
        }
    }

    // ទាញយកបញ្ជីផែនការដឹកជញ្ជូន[cite: 16]
    async function loadTransportPlans() {
        try {
            const res = await fetch('/api/fleet/transport-plans');
            const data = await res.json();
            const tbody = document.querySelector('#transportPlanTable tbody');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-3">ពុំមានទិន្នន័យផែនការដឹកជញ្ជូនទេ</td></tr>`;
                return;
            }

            data.forEach((item, index) => {
                let badgeClass = item.status === 'Completed' ? 'bg-success' : 'bg-warning text-dark';
                tbody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${item.cargo_code}</strong></td>
                        <td>${item.vehicle_code}</td>
                        <td>${item.origin} ➔ ${item.destination}</td>
                        <td>${item.departure_date.split('T')[0]}</td>
                        <td>${item.driver_name}</td>
                        <td><span class="badge ${badgeClass}">${item.status || 'Planned'}</span></td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error('Error loading transport plans:', err);
        }
    }

    // បញ្ជូនទិន្នន័យបង្កើតផែនការថ្មី[cite: 16]
    document.getElementById('transportPlanForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = Object.fromEntries(new FormData(e.target).entries());
        try {
            const res = await fetch('/api/fleet/transport-plans', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });
            const result = await res.json();
            if (result.success) {
                alert('បង្កើតផែនការដឹកជញ្ជូនបានជោគជ័យ!');
                e.target.reset();
                loadTransportPlans();
            } else {
                alert('កំហុស៖ ' + result.error);
            }
        } catch (err) {
            alert('មានបញ្ហាក្នុងการបញ្ជូនទិន្នន័យ');
        }
    });

    window.onload = () => {
        loadVehiclesDropdown();
        loadDriversDropdown();
        loadTransportPlans();
    };
</script>
</body>
</html>
