<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>រចនាសម្ព័ន្ធស្ថាប័នផែស្ងួត អេអិនធី - Dry Port Organization Chart & Workflow Dashboard ANT</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1e3c72;
            --secondary-color: #2a5298;
            --accent-color: #00c6ff;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #555555;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Kantumruy Pro', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 20px 30px;
            box-shadow: 0 4px 15px rgba(0, 198, 255, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        header .header-title h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
        }

        header .header-title p {
            margin: 4px 0 0 0;
            font-size: 13px;
            color: #dbeafe;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
        }

        .btn-action {
            background: #00c6ff;
            color: #1e3c72;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Kantumruy Pro', sans-serif;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }

        .btn-action:hover {
            background: #ffffff;
            color: var(--primary-color);
        }

        .btn-logout {
            background: #ef4444;
            color: white;
        }

        .btn-logout:hover {
            background: #dc2626;
            color: white;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .auth-card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }

        .auth-card h2 {
            color: var(--primary-color);
            margin-bottom: 5px;
            font-size: 22px;
        }

        .auth-card p {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 5px;
            color: #334155;
        }

        .form-control, .form-select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: 'Kantumruy Pro', sans-serif;
            font-size: 14px;
            box-sizing: border-box;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Kantumruy Pro', sans-serif;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }

        .toggle-link {
            margin-top: 15px;
            display: block;
            font-size: 13px;
            color: var(--secondary-color);
            text-decoration: underline;
            cursor: pointer;
        }

        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
            align-items: stretch; /* ធ្វើឱ្យប្រអប់កាតទាំងអស់មានកំពស់ស្មើគ្នា */
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0, 198, 255, 0.25);
            height: 100%;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #00c6ff, #ffffff, #8ae9ff, #0072ff, #00c6ff);
            background-size: 300% 100%;
            animation: diamondShimmer 3s linear infinite;
        }

        @keyframes diamondShimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .card-header {
            padding: 20px 20px 10px 20px;
            border-bottom: 1px solid var(--border-color);
            background-color: #fafbfc;
            text-align: center; /* ចំណងជើងកាតនៅចំកណ្តាល */
        }

        .card-header h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .card-header .eng-title {
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            margin-top: 4px;
        }

        .card-body {
            padding: 15px 20px 20px 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .role-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .role-item {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center; /* ให้อក្សរនៅចំកណ្តាលប្រអប់ទាំងផ្តេក និងបញ្ឈរ */
            text-align: center;   /* ให้อក្សរនៅចំកណ្តាលប្រអប់ */
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .role-item:hover {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #ffffff;
            border-color: transparent;
            transform: translateY(-2px);
        }

        .role-item:hover .role-km, 
        .role-item:hover .role-en {
            color: #ffffff;
        }

        .role-km {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .role-en {
            display: block;
            font-size: 12px;
            color: #64748b;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <!-- Popup Login / Register -->
    <div id="authModal" class="modal-overlay">
        <!-- Form Login -->
        <div id="loginCard" class="auth-card">
            <h2>ចូលប្រព័ន្ធ (Login)</h2>
            <p>ANT Dry Port Management Dashboard</p>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>ឈ្មោះគណនី (Username):</label>
                    <input type="text" id="loginUsername" class="form-control" placeholder="វាយឈ្មោះគណនី..." required>
                </div>
                <div class="form-group">
                    <label>ពាក្យសម្ងាត់ (Password):</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">ចូលប្រើប្រាស់</button>
            </form>
            <span class="toggle-link" onclick="switchForm('register')">+ បង្កើត ឬចុះឈ្មោះ User ថ្មី (Register)</span>
        </div>

        <!-- Form ចុះឈ្មោះ User ថ្មី (Register / Add User) -->
        <div id="registerCard" class="auth-card" style="display: none;">
            <h2>បង្កើត User ថ្មី (Create User)</h2>
            <p>ចុះឈ្មោះអ្នកប្រើប្រាស់ និងកំណត់សិទ្ធិ (Role)</p>
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>ឈ្មោះពេញ (Full Name):</label>
                    <input type="text" id="regFullName" class="form-control" placeholder="ឧ. សុខ ចាន់" required>
                </div>
                <div class="form-group">
                    <label>ឈ្មោះគណនី (Username):</label>
                    <input type="text" id="regUsername" class="form-control" placeholder="ឧ. sokchan" required>
                </div>
                <div class="form-group">
                    <label>ពាក្យសម្ងាត់ (Password):</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label>ប្រភេទសិទ្ធិ (Role Level):</label>
                    <select id="regRole" class="form-select" required onchange="toggleDeptSelect(this.value)">
                        <option value="STAFF">បុគ្គលិកតាមផ្នែក (Staff / User)</option>
                        <option value="ADMIN">អ្នកគ្រប់គ្រងប្រព័ន្ធ (Admin - មើលបានទាំងអស់)</option>
                    </select>
                </div>
                <div class="form-group" id="deptGroup">
                    <label>ជ្រើសរើសផ្នែក (Department):</label>
                    <select id="regDept" class="form-select">
                        <option value="HR_ADMIN">ធនធានមនុស្ស & រដ្ឋបាល</option>
                        <option value="ACC_FIN">គណនេយ្យ & ហិរញ្ញវត្ថុ</option>
                        <option value="TRANSPORT">ផ្នែកដឹកជញ្ជូន</option>
                        <option value="CONTAINER_MGT">ផ្នែកគ្រប់គ្រងកុងតឺន័រ</option>
                        <option value="TECH_STUFFING">ផ្នែកត្រួតពិនិត្យទីលានកុងតឺន័រ</option>
                        <option value="IT_SYSTEMS">ផ្នែកព័ត៌មានវិទ្យា & ប្រព័ន្ធ</option>
                        <option value="CUSTOMER_SVC">ផ្នែកសេវាកម្មអតិថិជន</option>
                        <option value="FACILITIES">ប្រធានផ្នែកសម្ភារឯកសារ</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit" style="background: #10b981;">រក្សាទុក User ថ្មី</button>
            </form>
            <span class="toggle-link" onclick="switchForm('login')">← ត្រឡប់ទៅទំព័រ Login វិញ</span>
        </div>
    </div>

    <!-- Header Dashboard -->
    <header>
        <div class="header-title">
            <h1>រចនាសម្ព័ន្ធស្ថាប័នផែស្ងួត អេអិនធី</h1>
            <p>DRY PORT ORGANIZATION CHART & WORKFLOW DASHBOARD ANT</p>
        </div>
        <div class="user-info" id="userInfoDisplay" style="display: none;">
            <span id="welcomeText"><i class="fa-solid fa-user me-1"></i>...</span>
            <button class="btn-action" id="btnCreateUser" onclick="openCreateUserModal()" style="display: none;">+ បង្កើត User</button>
            <button class="btn-action btn-logout" onclick="handleLogout()">ចាកចេញ</button>
        </div>
    </header>

    <div class="container">
        <div id="dashboard" class="grid-container">
            <!-- Content Rendered dynamically -->
        </div>
    </div>

    <script>
        const englishTitles = {
            "HR_ADMIN": "HR & Administration Department",
            "ACC_FIN": "Accounting & Finance Department",
            "TRANSPORT": "Transport Department",
            "CONTAINER_MGT": "Container Management Department",
            "TECH_STUFFING": "Technical & Stuffing/Unstuffing Department",
            "IT_SYSTEMS": "IT & Systems Department",
            "CUSTOMER_SVC": "Customer Service Department",
            "FACILITIES": "Documentation & General Management"
        };

        const roleDetails = {
            "វត្តមាន ចេញ/ចូល": { en: "Staff Attendance Check-in / Check-out", url: "/views/hr-in-out.html" },
            "ទ្រព្យសម្បត្តិ/ស្តុក និងការគ្រប់គ្រង សារពើភណ្ឌ": { en: "Asset, Stock & Inventory Management", url: "/views/hr-asset.html" },
            "ការជ្រើសរើសបុគ្គលិក & ការបណ្តុះបណ្តាល": { en: "HR Recruitment & Training", url: "/views/hr-management.html" },
            "ប្រាក់បៀវត្សរ៍ - ដំណើរការប្រាក់ខែ & អត្ថប្រយោជន៍": { en: "Payroll Processing & Benefits", url: "/views/hr-payroll.html" },
            
            "គណនេយ្យប្រាក់ចំណូល": { en: "Revenue Accounting", url: "/views/acc-revenue.html" },
            "គណនេយ្យទទួល": { en: "Accounts Receivable", url: "/views/acc-receivable.html" },
            "របាយការណ៍ហិរញ្ញវត្ថុ": { en: "Financial Reporting", url: "/views/acc-finance.html" },
            "ការគ្រប់គ្រងថវិកា / ចំណាយ": { en: "Budget & Expense Control", url: "/views/acc-control.html" },

            "ការចាត់ចែងរថយន្ត & ដឹកជញ្ជូន": { en: "Fleet & Transport Dispatch", url: "/views/transport-fleet.html" },
            "ការគ្រប់គ្រងអ្នកបើកបរ": { en: "Driver Management", url: "/views/transport-drivers.html" },
            "ការគ្រប់គ្រងប្រេងឥន្ធនៈ / ការថែទាំ": { en: "Fuel & Maintenance Management", url: "/views/transport-maintenance.html" },
            "ការរៀបចំផែនការដឹកជញ្ជូនទំនិញ": { en: "Cargo Transport Planning", url: "/views/transport-planning.html" },

            "ការត្រួតពិនិត្យកុងតឺន័រខូច": { en: "Damaged Container Inspection", url: "/views/container-damage.html" },
            "ការគ្រប់គ្រងទីតាំងកុងតឺន័រ": { en: "Container Yard Location Management", url: "/views/container-yard.html" },
            "ការថែទាំ និងជួសជុល": { en: "Maintenance & Repair (M&R)", url: "/views/container-stock.html" },
            "ការចេញកុងតឺន័រវិញ": { en: "Container Gate-Out", url: "/views/container-gateout.html" },

            "ប្រតិបត្តិការនៅទីលាន": { en: "Yard Operations", url: "/views/tech-stuffing.html" },
            "ការចូល / ចេញទំនិញ": { en: "Cargo Gate-In / Gate-Out", url: "/views/cargo-gate.html" },
            "ក្រុមសន្តិសុខ": { en: "Security Guard Team", url: "/views/tech-safety.html" },

            "ប្រព័ន្ធ WMS / OMS": { en: "WMS & OMS Systems", url: "/views/it-wms.html" },
            "ប្រព័ន្ធ CCTV & បណ្តាញ": { en: "CCTV & Network Infrastructure", url: "/views/it-cctv.html" },
            "ការគ្រប់គ្រងទិន្នន័យ": { en: "Data Management & Security", url: "/views/it-data.html" },

            "ទំនាក់ទំនងជាមួយអតិថិជន": { en: "Customer Relations", url: "/views/cs-relations.html" },
            "ការដោះស្រាយបញ្ហា / ការតវ៉ា": { en: "Dispute & Complaint Resolution", url: "/views/cs-complaints.html" },
            "ជំនួយការផ្នែកស្វែងរកប្រភព": { en: "Sourcing & General Support", url: "/views/cs-support.html" },

            "ការគ្រប់គ្រងឯកសារ": { en: "Document Management", url: "/views/doc-management.html" },
            "ការគ្រប់គ្រងបញ្ចូលទិន័យប្រព័ន្ធគយ": { en: "Customs System Data Entry Management", url: "/views/doc-customs.html" },
            "អ្នកកាន់ឯកសារ": { en: "Document Controller / Handler", url: "/views/doc-handler.html" }
        };

        const departments = [
            { id: "HR_ADMIN", name: "ធនធានមនុស្ស & រដ្ឋបាល", roles: ["វត្តមាន ចេញ/ចូល", "ទ្រព្យសម្បត្តិ/ស្តុក និងការគ្រប់គ្រង សារពើភណ្ឌ", "ការជ្រើសរើសបុគ្គលិក & ការបណ្តុះបណ្តាល", "ប្រាក់បៀវត្សរ៍ - ដំណើរការប្រាក់ខែ & អត្ថប្រយោជន៍"] },
            { id: "ACC_FIN", name: "គណនេយ្យ & ហិរញ្ញវត្ថុ", roles: ["គណនេយ្យប្រាក់ចំណូល", "គណនេយ្យទទួល", "របាយការណ៍ហិរញ្ញវត្ថុ", "ការគ្រប់គ្រងថវិកា / ចំណាយ"] },
            { id: "TRANSPORT", name: "ផ្នែកដឹកជញ្ជូន", roles: ["ការចាត់ចែងរថយន្ត & ដឹកជញ្ជូន", "ការគ្រប់គ្រងអ្នកបើកបរ", "ការគ្រប់គ្រងប្រេងឥន្ធនៈ / ការថែទាំ", "ការរៀបចំផែនការដឹកជញ្ជូនទំនិញ"] },
            { id: "CONTAINER_MGT", name: "ផ្នែកគ្រប់គ្រងកុងតឺន័រ", roles: ["ការត្រួតពិនិត្យកុងតឺន័រខូច", "ការគ្រប់គ្រងទីតាំងកុងតឺន័រ", "ការថែទាំ និងជួសជុល", "ការចេញកុងតឺន័រវិញ"] },
            { id: "TECH_STUFFING", name: "ផ្នែកត្រួតពិនិត្យទីលានកុងតឺន័រ", roles: ["ប្រតិបត្តិការនៅទីលាន", "ការចូល / ចេញទំនិញ", "ក្រុមសន្តិសុខ"] },
            { id: "IT_SYSTEMS", name: "ផ្នែកព័ត៌មានវិទ្យា & ប្រព័ន្ធ", roles: ["ប្រព័ន្ធ WMS / OMS", "ប្រព័ន្ធ CCTV & បណ្តាញ", "ការគ្រប់គ្រងទិន្នន័យ"] },
            { id: "CUSTOMER_SVC", name: "ផ្នែកសេវាកម្មអតិថិជន", roles: ["ទំនាក់ទំនងជាមួយអតិថិជន", "ការដោះស្រាយបញ្ហា / ការតវ៉ា", "ជំនួយការផ្នែកស្វែងរកប្រភព"] },
            { id: "FACILITIES", name: "ប្រធានផ្នែកសម្ភារឯកសារ", roles: ["ការគ្រប់គ្រងឯកសារ", "ការគ្រប់គ្រងបញ្ចូលទិន័យប្រព័ន្ធគយ", "អ្នកកាន់ឯកសារ"] }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const loggedUser = JSON.parse(localStorage.getItem('ant_logged_user_info'));
            if (loggedUser) {
                document.getElementById('authModal').style.display = 'none';
                document.getElementById('userInfoDisplay').style.display = 'flex';
                document.getElementById('welcomeText').innerText = `${loggedUser.full_name} (${loggedUser.role})`;
                
                if (loggedUser.role === 'ADMIN') {
                    document.getElementById('btnCreateUser').style.display = 'inline-block';
                }
                renderDashboard(loggedUser);
            }
        });

        function switchForm(type) {
            if (type === 'register') {
                document.getElementById('loginCard').style.display = 'none';
                document.getElementById('registerCard').style.display = 'block';
            } else {
                document.getElementById('registerCard').style.display = 'none';
                document.getElementById('loginCard').style.display = 'block';
            }
        }

        function toggleDeptSelect(role) {
            document.getElementById('deptGroup').style.display = role === 'ADMIN' ? 'none' : 'block';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();
                if (response.ok && result.success) {
                    localStorage.setItem('ant_logged_user_info', JSON.stringify(result.user));
                    location.reload();
                } else {
                    alert('បរាជ័យ៖ ' + (result.error || 'ឈ្មោះគណនី ឬពាក្យសម្ងាត់មិនត្រឹមត្រូវ!'));
                }
            } catch (err) {
                alert('មានបញ្ហាក្នុងការតភ្ជាប់ទៅកាន់ Server!');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const payload = {
                full_name: document.getElementById('regFullName').value.trim(),
                username: document.getElementById('regUsername').value.trim(),
                password: document.getElementById('regPassword').value.trim(),
                role: document.getElementById('regRole').value,
                dept_id: document.getElementById('regRole').value === 'ADMIN' ? 'ALL' : document.getElementById('regDept').value
            };

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if (response.ok && result.success) {
                    alert('បានបង្កើត User ថ្មីដោយជោគជ័យ! សូមធ្វើការ Login');
                    switchForm('login');
                    document.getElementById('registerForm').reset();
                } else {
                    alert('បរាជ័យ៖ ' + (result.error || 'ឈ្មោះគណនីនេះមានរួចហើយ!'));
                }
            } catch (err) {
                alert('មានបញ្ហាក្នុងការតភ្ជាប់ទៅកាន់ Server!');
            }
        }

        function openCreateUserModal() {
            document.getElementById('authModal').style.display = 'flex';
            switchForm('register');
        }

        function handleLogout() {
            localStorage.removeItem('ant_logged_user_info');
            location.reload();
        }

        function renderDashboard(user) {
            const dashboardContainer = document.getElementById('dashboard');
            dashboardContainer.innerHTML = '';

            let filteredDepts = departments;
            if (user.role !== "ADMIN") {
                filteredDepts = departments.filter(dept => dept.id === user.dept_id);
            }

            filteredDepts.forEach(dept => {
                let engName = englishTitles[dept.id] || "Department";
                
                let rolesHtml = dept.roles.map(role => {
                    let info = roleDetails[role] || { en: "Workflow Item", url: "#" };
                    return `
                        <li>
                            <a href="${info.url}" class="role-item">
                                <span class="role-km">${role}</span>
                                <span class="role-en">${info.en}</span>
                            </a>
                        </li>
                    `;
                }).join('');
                
                let card = `
                    <div class="card">
                        <div class="card-header">
                            <h3>${dept.name}</h3>
                            <div class="eng-title">${engName}</div>
                        </div>
                        <div class="card-body">
                            <ul class="role-list">${rolesHtml}</ul>
                        </div>
                    </div>
                `;
                dashboardContainer.innerHTML += card;
            });
        }
    </script>
</body>
</html>
