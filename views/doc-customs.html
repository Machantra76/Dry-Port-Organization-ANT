<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ការគ្រប់គ្រងបញ្ចូលទិន្នន័យប្រព័ន្ធគយ (Customs System Data Entry Management)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Kantumruy Pro -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kantumruy Pro', sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }
        .main-container {
            max-width: 1000px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        .btn-back {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            font-weight: 500;
            border-radius: 8px;
            padding: 10px 18px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.2);
            transition: all 0.2s;
        }
        .btn-back:hover {
            background: linear-gradient(135deg, #0369a1, #075985);
            color: white;
            transform: translateY(-1px);
        }
        .btn-jump-table {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            font-weight: 500;
            border-radius: 8px;
            padding: 10px 18px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(139, 92, 246, 0.25);
            transition: all 0.2s;
        }
        .btn-jump-table:hover {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: white;
            transform: translateY(-1px);
        }
        .page-title {
            color: #1e3a8a;
            font-weight: 700;
            margin-top: 20px;
            font-size: 1.75rem;
        }
        .page-subtitle {
            color: #6c757d;
            font-size: 0.95rem;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .section-card {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
            background-color: #ffffff;
        }
        .section-card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e3a8a;
            margin-bottom: 20px;
        }
        .form-label {
            font-weight: 500;
            font-size: 0.9rem;
            color: #495057;
        }
        .form-control, .form-select {
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            padding: 10px 14px;
            font-size: 0.9rem;
            font-family: 'Kantumruy Pro', sans-serif;
        }
        .form-control:focus, .form-select:focus {
            border-color: #0d9488;
            box-shadow: 0 0 0 0.2rem rgba(13, 148, 136, 0.15);
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, #0d9488, #0f766e);
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px 20px;
            border-radius: 8px;
            width: 100%;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.3);
            transition: all 0.2s;
        }
        .btn-primary-custom:hover {
            background: linear-gradient(135deg, #0f766e, #115e59);
            transform: translateY(-1px);
            color: white;
        }
        .btn-secondary-custom {
            background: linear-gradient(135deg, #64748b, #475569);
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px 20px;
            border-radius: 8px;
            width: 100%;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(100, 116, 139, 0.3);
            transition: all 0.2s;
        }
        .btn-secondary-custom:hover {
            background: linear-gradient(135deg, #475569, #334155);
            transform: translateY(-1px);
            color: white;
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- ប៊ូតុងត្រឡប់ក្រោយ និង ប៊ូតុងទៅកាន់ទំព័រតារាងបញ្ជី -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="/" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i> ត្រឡប់ទៅផ្ទាំងដើមវិញ
        </a>
        <a href="/customs-records.html" class="btn-jump-table">
            <i class="fa-solid fa-table-list"></i> មើលតារាងបញ្ជីទិន្នន័យប្រព័ន្ធគយ
        </a>
    </div>

    <!-- ចំណងជើងទំព័រ -->
    <h2 class="page-title">ការគ្រប់គ្រងបញ្ចូលទិន្នន័យប្រព័ន្ធគយ</h2>
    <p class="page-subtitle">CUSTOMS SYSTEM DATA ENTRY MANAGEMENT</p>

    <!-- Form បញ្ចូលទិន្នន័យប្រព័ន្ធគយថ្មី -->
    <div class="section-card">
        <div class="section-card-title"><i class="fa-solid fa-database me-2"></i> បញ្ចូលទិន្នន័យប្រព័ន្ធគយថ្មី (New Customs System Data Entry)</div>
        <form id="customsDataForm">
            <input type="hidden" id="editId" value="">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">ជ្រើសរើសលេខឯកសារយោង / វិក្កយបត្រ (Reference / Document No.):</label>
                    <select class="form-select" id="reference_number" required onchange="onReferenceChange()">
                        <option value="">-- ជ្រើសរើសលេខឯកសារគយ --</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">ឈ្មោះក្រុមហ៊ុន / ម្ចាស់ទំនិញ (Company Name):</label>
                    <input type="text" class="form-control" id="company_name" placeholder="ស្វ័យប្រវត្តិពេលជ្រើសរើសឯកសារយោង" required readonly style="background-color: #f8fafc;">
                </div>
                <div class="col-md-4">
                    <label class="form-label">លេខកូដប្រព័ន្ធ / សេចក្តីប្រកាស (System / Declaration Code):</label>
                    <input type="text" class="form-control" id="sys_code" placeholder="ឧ. SYS-DECL-2026-001" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">ប្រភេទប្រតិបត្តិការប្រព័ន្ធ (Transaction Type):</label>
                    <select class="form-select" id="transaction_type" required>
                        <option value="ASYCUDA Input">ការបញ្ចូលទិន្នន័យក្នុងប្រព័ន្ធ ASYCUDA</option>
                        <option value="Manifest Registration">ការចុះបញ្ជីទំនិញនាំចូល/ចេញ (Manifest)</option>
                        <option value="Duty Calculation">ការគណនាពន្ធ និងអាករ (Duty Calculation)</option>
                        <option value="Inspection Entry">ការកត់ត្រាពិនិត្យទំនិញ (Inspection Entry)</option>
                        <option value="System Clearance">ការបោសសម្អាតតាមប្រព័ន្ធ (Clearance)</option>
                        <option value="Transit Permit">ប័ណ្ណឆ្លងកាត់ (Transit Permit)</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">កាលបរិច្ឆេទបញ្ចូលទិន្នន័យ (Entry Date):</label>
                    <input type="date" class="form-control" id="entry_date" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">ស្ថានភាពប្រព័ន្ធ (System Status):</label>
                    <select class="form-select" id="system_status">
                        <option value="Pending">កំពុងរង់ចាំផ្ទៀងផ្ទាត់ (Pending)</option>
                        <option value="Processing">កំពុងដំណើរការក្នុងប្រព័ន្ធ (Processing)</option>
                        <option value="Completed">បានបញ្ជូន និងរួចរាល់ (Completed)</option>
                        <option value="Error">មានបញ្ហា / កំហុសទិន្នន័យ (Error)</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">មន្ត្រីប្រតិបត្តិករប្រព័ន្ធ (Operator Name):</label>
                    <input type="text" class="form-control" id="operator_name" placeholder="ឧ. លោក សុខ ជា" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">ច្រកទ្វារ ឬការិយាល័យគយ (Customs Office / Gate):</label>
                    <input type="text" class="form-control" id="customs_office" placeholder="ឧ. ការិយាល័យគយ និងរដ្ឋាករកំពង់ផែស្វយ័តភ្នំពេញ">
                </div>
                <div class="col-12">
                    <label class="form-label">កំណត់សម្គាល់បន្ថែម (Remarks / Notes):</label>
                    <textarea class="form-control" id="remarks" rows="3" placeholder="បញ្ជាក់ព័ត៌មានលម្អិតបន្ថែមពីការបញ្ចូលទិន្នន័យ..."></textarea>
                </div>
                
                <!-- 💡 ប៊ូតុងរក្សាទុក និង ចុះបញ្ជីថ្មី -->
                <div class="col-12 mt-4">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <button type="submit" class="btn btn-primary-custom" id="saveBtn">
                                <i class="fa-solid fa-floppy-disk me-2"></i> រក្សាទុកទិន្នន័យប្រព័ន្ធគយ
                            </button>
                        </div>
                        <div class="col-md-6">
                            <button type="button" class="btn btn-secondary-custom" onclick="resetForm()">
                                <i class="fa-solid fa-file-circle-plus me-2"></i> ចុះបញ្ជីថ្មី (Reset Form)
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let availableDocuments = [];

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('entry_date').value = new Date().toISOString().split('T')[0];
        loadDocumentDropdown();
    });

    async function loadDocumentDropdown() {
        try {
            const response = await fetch('/api/customs-documents');
            const docs = await response.json();
            availableDocuments = Array.isArray(docs) ? docs : [];
            
            const select = document.getElementById('reference_number');
            select.innerHTML = '<option value="">-- ជ្រើសរើសលេខឯកសារគយ --</option>';
            
            availableDocuments.forEach(doc => {
                const option = document.createElement('option');
                option.value = doc.document_number;
                option.textContent = `${doc.document_number} (${doc.company_name})`;
                select.appendChild(option);
            });
        } catch (err) {
            console.error('Error loading documents for dropdown:', err);
        }
    }

    function onReferenceChange() {
        const selectedRefNo = document.getElementById('reference_number').value;
        const companyInput = document.getElementById('company_name');

        if (!selectedRefNo) {
            companyInput.value = '';
            return;
        }

        const matchedDoc = availableDocuments.find(doc => doc.document_number === selectedRefNo);
        if (matchedDoc && matchedDoc.company_name) {
            companyInput.value = matchedDoc.company_name;
        } else {
            companyInput.value = '';
        }
    }

    function resetForm() {
        document.getElementById('customsDataForm').reset();
        document.getElementById('editId').value = '';
        document.getElementById('company_name').value = '';
        document.getElementById('entry_date').value = new Date().toISOString().split('T')[0];
        document.getElementById('saveBtn').innerHTML = `<i class="fa-solid fa-floppy-disk me-2"></i> រក្សាទុកទិន្នន័យប្រព័ន្ធគយ`;
    }

    document.getElementById('customsDataForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const editId = document.getElementById('editId').value;
        const payload = {
            sys_code: document.getElementById('sys_code').value,
            company_name: document.getElementById('company_name').value,
            transaction_type: document.getElementById('transaction_type').value,
            entry_date: document.getElementById('entry_date').value,
            system_status: document.getElementById('system_status').value,
            operator_name: document.getElementById('operator_name').value,
            reference_number: document.getElementById('reference_number').value,
            customs_office: document.getElementById('customs_office').value,
            remarks: document.getElementById('remarks').value
        };

        try {
            const url = editId ? `/api/customs-system-data/${editId}` : '/api/customs-system-data';
            const method = editId ? 'PUT' : 'POST';

            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            if (response.ok && result.success) {
                alert(editId ? 'បានកែប្រែទិន្នន័យដោយជោគជ័យ!' : 'បានចុះបញ្ជីទិន្នន័យប្រព័ន្ធគយថ្មីដោយជោគជ័យ!');
                resetForm();
                loadDocumentDropdown();
            } else {
                alert('បរាជ័យ៖ ' + (result.error || 'សូមពិនិត្យទិន្នន័យឡើងវិញ'));
            }
        } catch (err) {
            console.error('Error submitting form:', err);
            alert('មានបញ្ហាក្នុងការតភ្ជាប់ទៅកាន់ Server!');
        }
    });
</script>

</body>
</html>
