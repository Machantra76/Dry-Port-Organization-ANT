<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ការគ្រប់គ្រងថវិកា / ចំណាយ - Budget & Expense Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kantumruy Pro', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 30px;
            color: #334155;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .top-nav-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-btn, .btn-nav-table, .btn-nav-form {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            padding: 9px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Kantumruy Pro', sans-serif;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
            height: 40px;
            box-sizing: border-box;
        }
        .back-btn { background: #2a5298; color: white; }
        .back-btn:hover { background: #1e3c72; color: white; }
        
        .btn-nav-table { background: #8b5cf6; color: white; }
        .btn-nav-table:hover { background: #7c3aed; color: white; }

        .btn-nav-form { background: #059669; color: white; }
        .btn-nav-form:hover { background: #047857; color: white; }

        h1 { color: #1e3c72; margin: 0; font-size: 26px; }
        .eng-sub {
            color: #64748b;
            font-size: 14px;
            text-transform: uppercase;
            margin-top: 5px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: 600; font-size: 14px; color: #1e3c72; margin-bottom: 5px; }
        input, select, textarea {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-family: 'Kantumruy Pro', sans-serif;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }
        textarea { resize: vertical; height: 38px; }
        .btn-submit {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Kantumruy Pro', sans-serif;
            margin-top: 20px;
            width: 100%;
            font-size: 15px;
            transition: background 0.3s;
        }
        .btn-submit:hover { background: #059669; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 12px;
            text-align: left;
            font-size: 14px;
        }
        th { background: #f8fafc; color: #1e3c72; font-weight: 700; }
        tr:nth-child(even) { background: #fbfdff; }
        .section-box {
            margin-top: 30px;
            padding: 25px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .section-box h3 {
            margin-top: 0;
            color: #1e3c72;
            font-size: 18px;
            border-bottom: 2px solid #cbd5e1;
            padding-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ប៊ូតុងរុករក និងប្តូរទិដ្ឋភាពឱ្យមានទំហំស្មើគ្នា -->
        <div class="top-nav-buttons">
            <a href="/" class="back-btn"><i class="fa-solid fa-arrow-left"></i> ត្រឡប់ទៅ Dashboard វិញ</a>
            <button type="button" id="btnShowTable" class="btn-nav-table" onclick="switchSection('table')">
                <i class="fa-solid fa-table-list"></i> មើលបញ្ជីប្រវត្តិចំណាយ
            </button>
            <button type="button" id="btnShowForm" class="btn-nav-form" style="display: none;" onclick="switchSection('form')">
                <i class="fa-solid fa-plus-circle"></i> កត់ត្រាចំណាយថ្មី
            </button>
        </div>
        
        <h1>ការគ្រប់គ្រងថវិកា / ចំណាយ</h1>
        <div class="eng-sub">Budget & Expense Control Management</div>

        <!-- ទម្រង់កត់ត្រាចំណាយថ្មី -->
        <div class="section-box" id="formSection">
            <h3>កត់ត្រាបانចំណាយថ្មី (Record New Expense)</h3>
            <form id="expenseForm" onsubmit="saveExpense(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>កាលបរិច្ឆេទចំណាយ (Date):</label>
                        <input type="date" id="expense_date" required>
                    </div>
                    <div class="form-group">
                        <label>ប្រភេទចំណាយ (Category):</label>
                        <select id="category" required>
                            <option value="Operational Expense">ចំណាយប្រតិបត្តិការ (Operational Expense)</option>
                            <option value="Salary & Wages">ប្រាក់បៀវត្សរ៍បុគ្គលិក (Salary & Wages)</option>
                            <option value="Maintenance & Repair">ការថែទាំ និងជួសជុល (Maintenance & Repair)</option>
                            <option value="Utilities">ទឹក ភ្លើង អ៊ីនធឺណិត (Utilities)</option>
                            <option value="Other">ផ្សេងៗ (Other)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>បរិមាណទឹកប្រាក់ ($ Amount):</label>
                        <input type="number" step="0.01" id="amount" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label>បង់ឱ្យ / អ្នកផ្គត់ផ្គង់ (Paid To):</label>
                        <input type="text" id="paid_to" placeholder="ឈ្មោះអ្នកទទួលប្រាក់" required>
                    </div>
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label>បរិយាយ / មូលហេតុ (Description):</label>
                    <textarea id="description" placeholder="ពិពណ៌នាបន្ថែមពីចំណាយ..."></textarea>
                </div>
                <button type="submit" class="btn-submit">💾 រក្សាទុកចំណាយ (Save Expense)</button>
            </form>
        </div>

        <!-- បញ្ជីចំណាយសរុប (លាក់ទុកដំបូង) -->
        <div class="section-box" id="tableSection" style="display: none;">
            <h3>បញ្ជីប្រវត្តិចំណាយ (Expense History Records)</h3>
            <table>
                <thead>
                    <tr>
                        <th>ល.រ (No.)</th>
                        <th>កាលបរិច្ឆេទ (Date)</th>
                        <th>ប្រភេទ (Category)</th>
                        <th>បរិយាយ (Description)</th>
                        <th>អ្នកទទួល (Paid To)</th>
                        <th>ទឹកប្រាក់ ($)</th>
                    </tr>
                </thead>
                <tbody id="expenseTableBody">
                    <tr><td colspan="6" style="text-align: center; color: #64748b;">កំពុងទាញយកទិន្នន័យ...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const expenseDateInput = document.getElementById('expense_date');
            if (expenseDateInput) {
                expenseDateInput.valueAsDate = new Date();
            }
            loadExpenses();
        });

        // មុខងារប្តូរទិដ្ឋភាពរវាង Form និង Table
        function switchSection(section) {
            const formSection = document.getElementById('formSection');
            const tableSection = document.getElementById('tableSection');
            const btnShowTable = document.getElementById('btnShowTable');
            const btnShowForm = document.getElementById('btnShowForm');

            if (!formSection || !tableSection) return;

            if (section === 'table') {
                formSection.style.display = 'none';
                tableSection.style.display = 'block';
                if (btnShowTable) btnShowTable.style.display = 'none';
                if (btnShowForm) btnShowForm.style.display = 'inline-flex';
                loadExpenses();
            } else {
                tableSection.style.display = 'none';
                formSection.style.display = 'block';
                if (btnShowForm) btnShowForm.style.display = 'none';
                if (btnShowTable) btnShowTable.style.display = 'inline-flex';
            }
        }

        async function loadExpenses() {
            try {
                const response = await fetch('/api/expenses');
                const data = await response.json();
                const tbody = document.getElementById('expenseTableBody');
                if (!tbody) return;
                tbody.innerHTML = '';

                if (!Array.isArray(data) || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #64748b;">គ្មានទិន្នន័យចំណាយនៅឡើយទេ</td></tr>';
                    return;
                }

                data.forEach((item, index) => {
                    const rowDate = item.expense_date ? new Date(item.expense_date).toLocaleDateString('km-KH') : '-';
                    const row = `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${rowDate}</td>
                            <td>${item.category}</td>
                            <td>${item.description || '-'}</td>
                            <td>${item.paid_to}</td>
                            <td style="font-weight: 700; color: #dc2626;">-$${parseFloat(item.amount).toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (err) {
                console.error(err);
                const tbody = document.getElementById('expenseTableBody');
                if (tbody) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: red;">មានបញ្ហាក្នុងការទាញយកបញ្ជីចំណាយ</td></tr>';
                }
            }
        }

        async function saveExpense(event) {
            event.preventDefault();
            const payload = {
                expense_date: document.getElementById('expense_date').value,
                category: document.getElementById('category').value,
                amount: document.getElementById('amount').value,
                paid_to: document.getElementById('paid_to').value,
                description: document.getElementById('description').value
            };

            try {
                const response = await fetch('/api/expenses', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (result.success) {
                    alert('បានកត់ត្រាចំណាយដោយជោគជ័យ!');
                    const expenseForm = document.getElementById('expenseForm');
                    if (expenseForm) expenseForm.reset();
                    const expenseDateInput = document.getElementById('expense_date');
                    if (expenseDateInput) expenseDateInput.valueAsDate = new Date();
                    loadExpenses();
                    switchSection('table');
                } else {
                    alert('កំហុស៖ ' + result.error);
                }
            } catch (err) {
                console.error(err);
                alert('មិនអាចបញ្ជូនទិន្នន័យទៅកាន់ Server បានទេ');
            }
        }
    </script>
</body>
</html>
