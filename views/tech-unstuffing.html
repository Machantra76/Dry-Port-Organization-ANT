<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargo Gate-In / Gate-Out</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- html2pdf.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Khmer OS Siemreap', sans-serif;
        }
        .card {
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
    </style>
</head>
<body>

    <div class="container my-5">
        <h2 class="mb-4 text-center text-primary"><i class="fas id-card fa-exchange-alt"></i> ការគ្រប់គ្រងការចូល / ចេញទំនិញ (Cargo Gate-In / Gate-Out)</h2>

        <!-- Form សម្រាប់បញ្ចូលទិន្នន័យ Gate-In / Gate-Out -->
        <div class="card mb-4 p-4">
            <h4 class="mb-3">កត់ត្រាទំនិញ ចូល/ចេញ (Gate-In / Gate-Out)</h4>
            <form id="cargoGateForm">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">លេខកូដទំនិញ/វិក្កយបត្រ (Cargo Code)</label>
                        <input type="text" class="form-control" id="cargo_code" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">លេខកុងតឺន័រ (Container No - Optional)</label>
                        <input type="text" class="form-control" id="container_number" placeholder="ឧ. TGBU1234567">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">ប្រភេទប្រតិបត្តិការ (Gate Type)</label>
                        <select class="form-select" id="gate_type" required>
                            <option value="">-- ជ្រើសរើស --</option>
                            <option value="Gate-In">Gate-In (ចូល)</option>
                            <option value="Gate-Out">Gate-Out (ចេញ)</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">កាលបរិច្ឆេទ និងម៉ោង (Date & Time)</label>
                        <input type="datetime-local" class="form-control" id="gate_date" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">ស្លាកលេខរថយន្ត (Truck Plate No)</label>
                        <input type="text" class="form-control" id="truck_plate_number" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">ឈ្មោះអ្នកបើកបរ (Driver Name)</label>
                        <input type="text" class="form-control" id="driver_name" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">ឈ្មោះក្រុមហ៊ុនដឹកជញ្ជូន (Company)</label>
                        <input type="text" class="form-control" id="company_name">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">ស្ថានភាព (Status)</label>
                        <select class="form-select" id="status" required>
                            <option value="Completed">Completed (បានបញ្ចប់)</option>
                            <option value="Pending">Pending (កំពុងរង់ចាំ)</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">កំណត់ចំណាំ (Notes)</label>
                        <input type="text" class="form-control" id="notes">
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> រក្សាទុកទិន្នន័យ</button>
                </div>
            </form>
        </div>

        <!-- បញ្ជីប្រវត្តិការចូល / ចេញទំនិញ (History Table) -->
        <div class="card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0">បញ្ជីប្រវត្តិការចូល / ចេញទំនិញ (Gate History)</h4>
                <!-- ប៊ូតុង SAVE PDF -->
                <button id="downloadPdfBtn" class="btn btn-danger">
                    <i class="fas fa-file-pdf"></i> Save PDF
                </button>
            </div>

            <!-- Container សម្រាប់ទាញយក PDF เฉพาะតារាងនេះ -->
            <div id="cargoGateTableContainer" class="table-responsive">
                <table class="table table-striped table-bordered align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ល.រ</th>
                            <th>កូដទំនិញ</th>
                            <th>កុងតឺន័រ</th>
                            <th>ប្រភេទ</th>
                            <th>កាលបរិច្ឆេទ</th>
                            <th>ស្លាកលេខរថយន្ត</th>
                            <th>អ្នកបើកបរ</th>
                            <th>ក្រុមហ៊ុន</th>
                            <th>ស្ថានភាព</th>
                            <th>កំណត់ចំណាំ</th>
                        </tr>
                    </thead>
                    <tbody id="cargoGateTableBody">
                        <!-- ទិន្នន័យទាញមកពី Database នឹងបង្ហាញទីនេះ -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ១. មុខងារទាញយកទិន្នន័យមកបង្ហាញក្នុង Table
        async function fetchCargoGates() {
            try {
                const response = await fetch('/api/fleet/cargo-gates');
                const result = await response.json();
                
                const tbody = document.getElementById('cargoGateTableBody');
                tbody.innerHTML = '';

                if (result.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="10" class="text-center">ពុំទាន់មានទិន្នន័យ Gate-In / Gate-Out នៅឡើយ</td></tr>`;
                    return;
                }

                result.forEach((item, index) => {
                    const formattedDate = new Date(item.gate_date).toLocaleString('km-KH');
                    const badgeColor = item.gate_type === 'Gate-In' ? 'primary' : 'warning';
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${item.cargo_code}</td>
                        <td>${item.container_number || '-'}</td>
                        <td><span class="badge bg-${badgeColor}">${item.gate_type}</span></td>
                        <td>${formattedDate}</td>
                        <td>${item.truck_plate_number}</td>
                        <td>${item.driver_name}</td>
                        <td>${item.company_name || '-'}</td>
                        <td><span class="badge bg-${item.status === 'Completed' ? 'success' : 'secondary'}">${item.status}</span></td>
                        <td>${item.notes || '-'}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Error fetching cargo gate logs:', error);
            }
        }

        // ២. មុខងារបញ្ជូនទិន្នន័យថ្មី (Form Submit)
        document.getElementById('cargoGateForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const formData = {
                cargo_code: document.getElementById('cargo_code').value,
                container_number: document.getElementById('container_number').value,
                gate_type: document.getElementById('gate_type').value,
                gate_date: document.getElementById('gate_date').value,
                truck_plate_number: document.getElementById('truck_plate_number').value,
                driver_name: document.getElementById('driver_name').value,
                company_name: document.getElementById('company_name').value,
                status: document.getElementById('status').value,
                notes: document.getElementById('notes').value
            };

            try {
                const response = await fetch('/api/fleet/cargo-gates', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                if (result.success) {
                    alert('បានរក្សាទុកដោយជោគជ័យ!');
                    document.getElementById('cargoGateForm').reset();
                    fetchCargoGates();
                } else {
                    alert('កំហុស៖ ' + result.error);
                }
            } catch (error) {
                console.error('Error saving data:', error);
                alert('មិនអាចបញ្ជូនទិន្នន័យទៅកាន់ server បានទេ');
            }
        });

        // ៣. មុខងារ SAVE PDF เฉพาะតារាងប្រវត្តិ Gate-In / Gate-Out
        document.getElementById('downloadPdfBtn').addEventListener('click', function () {
            const element = document.getElementById('cargoGateTableContainer'); 

            const options = {
                margin:       10,
                filename:     'Cargo-Gate-History.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
            };

            html2pdf().from(element).set(options).save();
        });

        // ទាញយកទិន្នន័យពេលផ្ទុកទំព័ររួច
        window.onload = fetchCargoGates;
    </script>
</body>
</html>
