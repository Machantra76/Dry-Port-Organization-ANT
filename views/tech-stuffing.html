<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រវត្តិប្រតិបត្តិការទីលាន (Yard Operations History)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- html2pdf.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Khmer OS Siemreap', sans-serif;
        }
        .card {
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
    </style>
</head>
<body>

    <div class="container my-5">
        <h2 class="mb-4 text-center text-primary"><i class="fas fa-dolly"></i> ការគ្រប់គ្រង និងប្រវត្តិប្រតិបត្តិការទីលាន</h2>

        <!-- Form សម្រាប់បញ្ចូលទិន្នន័យប្រតិបត្តិការ -->
        <div class="card mb-4 p-4">
            <h4 class="mb-3">បន្ថែមប្រតិបត្តិការទីលានថ្មី</h4>
            <form id="yardOperationForm">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">លេខកុងតឺន័រ (Container Number)</label>
                        <input type="text" class="form-control" id="container_number" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">ប្រភេទប្រតិបត្តិការ (Operation Type)</label>
                        <select class="form-select" id="operation_type" required>
                            <option value="">-- ជ្រើសរើស --</option>
                            <option value="Lift-On">Lift-On (លើកដាក់)</option>
                            <option value="Lift-Off">Lift-Off (ដំឡើងចុះ)</option>
                            <option value="Relocation">Relocation (ប្តូរទីតាំង)</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">ទីតាំងក្នុងទីលាន (Yard Location)</label>
                        <input type="text" class="form-control" id="yard_location" placeholder="ឧ. Block A-02-3" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">កាលបរិច្ឆេទ និងម៉ោង</label>
                        <input type="datetime-local" class="form-control" id="operation_date" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">គ្រឿងចក្រប្រើប្រាស់ (Equipment)</label>
                        <input type="text" class="form-control" id="equipment_used" placeholder="ឧ. Crane 01">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">ឈ្មោះអ្នកបញ្ជា (Operator Name)</label>
                        <input type="text" class="form-control" id="operator_name" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">ស្ថានភាព (Status)</label>
                        <select class="form-select" id="status" required>
                            <option value="Completed">Completed (បានបញ្ចប់)</option>
                            <option value="Pending">Pending (កំពុងរង់ចាំ)</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">កំណត់ចំណាំ (Notes)</label>
                        <input type="text" class="form-control" id="notes">
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> រក្សាទុកទិន្នន័យ</button>
                </div>
            </form>
        </div>

        <!-- បញ្ជីប្រវត្តិប្រតិបត្តិការទីលាន (Yard Operations History) -->
        <div class="card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0">បញ្ជីប្រវត្តិប្រតិបត្តិការទីលាន (Yard Operations History)</h4>
                <!-- ប៊ូតុងទាញយក PDF -->
                <button id="downloadPdfBtn" class="btn btn-danger">
                    <i class="fas fa-file-pdf"></i> Download PDF
                </button>
            </div>

            <!-- Container សម្រាប់ចាប់យកទិន្នន័យធ្វើជា PDF -->
            <div id="yardHistoryTableContainer" class="table-responsive">
                <table class="table table-striped table-bordered align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ល.រ</th>
                            <th>លេខកុងតឺន័រ</th>
                            <th>ប្រភេទប្រតិបត្តិការ</th>
                            <th>ទីតាំងទីលាន</th>
                            <th>កាលបរិច្ឆេទ</th>
                            <th>គ្រឿងចក្រ</th>
                            <th>អ្នកបញ្ជា</th>
                            <th>ស្ថានភាព</th>
                            <th>កំណត់ចំណាំ</th>
                        </tr>
                    </thead>
                    <tbody id="yardTableBody">
                        <!-- ទិន្នន័យនឹងត្រូវទាញមកដាក់ទីនេះដោយស្វ័យប្រវត្តិតាមរយៈ JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- JavaScript សម្រាប់ទាញយកទិន្នន័យ និងមុខងារ Export PDF -->
    <script>
        // ១. មុខងារទាញយកទិន្នន័យពី Server មកបង្ហាញក្នុង Table
        async function fetchYardOperations() {
            try {
                const response = await fetch('/api/fleet/yard-operations');
                const result = await response.json();
                
                const tbody = document.getElementById('yardTableBody');
                tbody.innerHTML = '';

                if (result.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="9" class="text-center">ពុំទាន់มีទិន្នន័យប្រតិបត្តិការនៅឡើយ</td></tr>`;
                    return;
                }

                result.forEach((item, index) => {
                    const formattedDate = new Date(item.operation_date).toLocaleString('km-KH');
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${item.container_number}</td>
                        <td>${item.operation_type}</td>
                        <td>${item.yard_location}</td>
                        <td>${formattedDate}</td>
                        <td>${item.equipment_used || '-'}</td>
                        <td>${item.operator_name}</td>
                        <td><span class="badge bg-${item.status === 'Completed' ? 'success' : 'warning'}">${item.status}</span></td>
                        <td>${item.notes || '-'}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Error fetching yard operations:', error);
            }
        }

        // ២. មុខងារបញ្ជូនទិន្នន័យថ្មីទៅកាន់ Server (Form Submit)
        document.getElementById('yardOperationForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const formData = {
                container_number: document.getElementById('container_number').value,
                operation_type: document.getElementById('operation_type').value,
                yard_location: document.getElementById('yard_location').value,
                operation_date: document.getElementById('operation_date').value,
                equipment_used: document.getElementById('equipment_used').value,
                operator_name: document.getElementById('operator_name').value,
                status: document.getElementById('status').value,
                notes: document.getElementById('notes').value
            };

            try {
                const response = await fetch('/api/fleet/yard-operations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                if (result.success) {
                    alert('បានរក្សាទុកដោយជោគជ័យ!');
                    document.getElementById('yardOperationForm').reset();
                    fetchYardOperations(); // ರಿហ្វ្រេសតារាងឡើងវិញ
                } else {
                    alert('កំហុស៖ ' + result.error);
                }
            } catch (error) {
                console.error('Error saving data:', error);
                alert('មិនអាចបញ្ជូនទិន្នន័យទៅកាន់ server បានទេ');
            }
        });

        // ៣. កូដសម្រាប់ទាញយកតារាងប្រវត្តិប្រតិបត្តិការជា PDF
        document.getElementById('downloadPdfBtn').addEventListener('click', function () {
            const element = document.getElementById('yardHistoryTableContainer'); 

            const options = {
                margin:       10,
                filename:     'Yard-Operations-History.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' } // ប្រើទម្រង់ផ្តេក landscape ព្រោះតារាងមានជួរឈរច្រើន
            };

            // បម្លែង Element ទៅជា PDF រួចទាញយកស្វ័យប្រវត្តិ
            html2pdf().from(element).set(options).save();
        });

        // ទាញយកទិន្នន័យពេលបើកទំព័រដំបូង
        window.onload = fetchYardOperations;
    </script>
</body>
</html>
