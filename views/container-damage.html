<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ការត្រួតពិនិត្យកុងតឺន័រខូច - Damaged Container Inspection</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Khmer -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kantumruy Pro', sans-serif;
            background-color: #f4f6f9;
        }
        .sidebar {
            min-height: 100vh;
            background-color: #343a40;
            color: #fff;
        }
        .sidebar a {
            color: #cfd8dc;
            text-decoration: none;
            padding: 10px 15px;
            display: block;
            border-radius: 5px;
            margin-bottom: 5px;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: #0d6efd;
            color: #fff;
        }
        .card {
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
    </style>
</head>
<body>

    <div class="container-fluid">
        <div class="row">
            <!-- Navigation Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar p-3 d-none d-md-block">
                <h4 class="text-center py-3 text-white border-bottom mb-4">ប្រព័ន្ធគ្រប់គ្រង</h4>
                <a href="/views/transport-planning.html"><i class="fas fa-route me-2"></i> ផែនការដឹកជញ្ជូន</a>
                <a href="/views/damaged-container.html" class="active"><i class="fas fa-box-open me-2"></i> កុងតឺន័រខូច</a>
                <a href="/"><i class="fas fa-home me-2"></i> ទំព័រដើម</a>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 ms-sm-auto px-md-4 py-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2"><i class="fas fa-exclamation-triangle text-danger me-2"></i> ការត្រួតពិនិត្យកុងតឺន័រខូច (Damaged Containers)</h1>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addContainerModal">
                        <i class="fas fa-plus me-2"></i> កត់ត្រាកុងតឺន័រខូចថ្មី
                    </button>
                </div>

                <!-- Search & Filter Section -->
                <div class="card mb-4 p-3">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">ចាប់ពីថ្ងៃទី</label>
                            <input type="date" id="filterFrom" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">ដល់ថ្ងៃទី</label>
                            <input type="date" id="filterTo" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">កម្រិតធ្ងន់ធ្ងរ</label>
                            <select id="filterSeverity" class="form-select">
                                <option value="">ទាំងអស់</option>
                                <option value="Minor">ស្រាល (Minor)</option>
                                <option value="Moderate">មធ្យម (Moderate)</option>
                                <option value="Severe">ធ្ងន់ធ្ងរ (Severe)</option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex align-items-end">
                            <button class="btn btn-secondary w-100" onclick="loadDamagedContainers()">
                                <i class="fas fa-filter me-2"></i> ស្វែងរក / ឆែកមើល
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Table Data -->
                <div class="card p-3">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>ល.រ</th>
                                    <th>លេខកុងតឺន័រ</th>
                                    <th>ថ្ងៃខែត្រួតពិនិត្យ</th>
                                    <th>ទីតាំងខូចខាត</th>
                                    <th>កម្រិតធ្ងន់ធ្ងរ</th>
                                    <th>អ្នកពិនិត្យ</th>
                                    <th>ស្ថានភាព</th>
                                    <th>ពិពណ៌នា</th>
                                </tr>
                            </thead>
                            <tbody id="containerTableBody">
                                <!-- ទិន្នន័យនឹងត្រូវទាញមកបង្ហាញទីនេះដោយ JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal เพิ่มข้อมูลកុងតឺន័រខូច -->
    <div class="modal fade" id="addContainerModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form id="containerForm">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title"><i class="fas fa-plus-circle me-2"></i> កត់ត្រាទិន្នន័យកុងតឺន័រខូច</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">លេខកុងតឺន័រ (Container Number) *</label>
                                <input type="text" class="form-control" name="container_number" required placeholder="ឧ. TGHU1234567">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">ថ្ងៃខែត្រួតពិនិត្យ *</label>
                                <input type="date" class="form-control" name="inspection_date" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">ទីតាំងខូចខាត (Damage Location) *</label>
                                <input type="text" class="form-control" name="damage_location" required placeholder="ឧ. ទ្វារខាងមុខ, ដំបូល, ជញ្ជាំងឆ្វេង">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">កម្រិតធ្ងន់ធ្ងរ (Severity Level) *</label>
                                <select class="form-select" name="severity_level" required>
                                    <option value="Minor">ស្រាល (Minor)</option>
                                    <option value="Moderate">មធ្យម (Moderate)</option>
                                    <option value="Severe">ធ្ងន់ធ្ងរ (Severe)</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">ឈ្មោះអ្នកត្រួតពិនិត្យ (Inspector Name) *</label>
                                <input type="text" class="form-control" name="inspector_name" required placeholder="ឈ្មោះមន្ត្រីត្រួតពិនិត្យ">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">ស្ថានភាព (Status)</label>
                                <select class="form-select" name="status">
                                    <option value="Pending Repair">រង់ចាំជួសជុល (Pending Repair)</option>
                                    <option value="In Repair">កំពុងជួសជុល (In Repair)</option>
                                    <option value="Resolved">បានជួសជុលរួចរាល់ (Resolved)</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">បរិយាយ / កំណត់ចំណាំបន្ថែម</label>
                                <textarea class="form-control" name="description" rows="3" placeholder="ពិពណ៌នាអំពីលក្ខណៈនៃការខូចខាត..."></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">បោះបង់</button>
                        <button type="submit" class="btn btn-primary">រក្សាទុក</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // កំណត់ថ្ងៃខែបច្ចុប្បន្នស្វ័យប្រវត្តិក្នុង Form
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.querySelector('input[name="inspection_date"]').value = today;
            loadDamagedContainers();
        });

        // មុខងារទាញយកទិន្នន័យមកបង្ហាញក្នុង Table
        async function loadDamagedContainers() {
            const from = document.getElementById('filterFrom').value;
            const to = document.getElementById('filterTo').value;
            const severity = document.getElementById('filterSeverity').value;

            let url = '/api/fleet/damaged-containers?';
            if (from && to) url += `from=${from}&to=${to}&`;
            if (severity) url += `severity_level=${severity}`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                const tbody = document.getElementById('containerTableBody');
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted py-4">ពុំមានទិន្នន័យកុងតឺន័រខូចទេ</td></tr>`;
                    return;
                }

                data.forEach((item, index) => {
                    let badgeClass = 'bg-secondary';
                    if (item.severity_level === 'Minor') badgeClass = 'bg-info text-dark';
                    else if (item.severity_level === 'Moderate') badgeClass = 'bg-warning text-dark';
                    else if (item.severity_level === 'Severe') badgeClass = 'bg-danger';

                    let statusBadge = 'bg-warning text-dark';
                    if (item.status === 'Resolved') statusBadge = 'bg-success';
                    else if (item.status === 'In Repair') statusBadge = 'bg-primary';

                    const row = `
                        <tr>
                            <td>${index + 1}</td>
                            <td><strong>${item.container_number}</strong></td>
                            <td>${item.inspection_date ? item.inspection_date.split('T')[0] : ''}</td>
                            <td>${item.damage_location}</td>
                            <td><span class="badge ${badgeClass}">${item.severity_level}</span></td>
                            <td>${item.inspector_name}</td>
                            <td><span class="badge ${statusBadge}">${item.status}</span></td>
                            <td>${item.description || '-'}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (err) {
                console.error('Error loading data:', err);
                alert('មានបញ្ហាក្នុងการទាញយកទិន្នន័យ');
            }
        }

        // មុខងារបញ្ជូនទិន្នន័យ Form ទៅកាន់ API
        document.getElementById('containerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const payload = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('/api/fleet/damaged-containers', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if (response.ok) {
                    alert('បានកត់ត្រាទិន្នន័យកុងតឺន័រខូចដោយជោគជ័យ!');
                    this.reset();
                    // បិទ Modal
                    const modalElement = document.getElementById('addContainerModal');
                    const modal = bootstrap.Modal.getInstance(modalElement);
                    modal.hide();
                    // ទាញយកទិន្នន័យមកបង្ហាញសាថ្មី
                    loadDamagedContainers();
                } else {
                    alert('កំហុស៖ ' + (result.error || 'មិនអាចរក្សាទុកបានទេ'));
                }
            } catch (err) {
                console.error('Error saving data:', err);
                alert('មានបញ្ហាក្នុងការតភ្ជាប់ទៅកាន់ម៉ាស៊ីនមេ Server');
            }
        });
    </script>
</body>
</html>
